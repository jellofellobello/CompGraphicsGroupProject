<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shoe Customiser</title>
    <link rel="icon" href="data:,">
    <style>
        :root {
            --panel-bg: rgba(255, 249, 242, 0.88);
            --panel-border: rgba(70, 56, 44, 0.12);
            --panel-shadow: 0 24px 64px rgba(65, 44, 25, 0.14);
            --text-main: #2f241d;
            --text-muted: #7b6a5c;
            --accent: #b7643d;
            --surface: rgba(255, 255, 255, 0.72);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: "Manrope", "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #f8f2eb 0%, #efe4d8 50%, #e6d8cb 100%);
            color: var(--text-main);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .app-shell {
            display: grid;
            grid-template-columns: minmax(300px, 360px) 1fr;
            width: 100vw;
            height: 100vh;
        }

        .ui-zone {
            padding: 20px;
        }

        .viewport-zone {
            min-width: 0;
            overflow: hidden;
        }

        #sceneViewport {
            width: 100%;
            height: 100%;
            background: rgba(255, 250, 244, 0.18);
        }

        .ui-shell {
            padding: 22px;
            border: 1px solid var(--panel-border);
            border-radius: 24px;
            background: var(--panel-bg);
            box-shadow: var(--panel-shadow);
        }

        .eyebrow {
            margin: 0 0 6px;
            font-size: 0.73rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--accent);
        }

        .ui-shell h1 {
            margin: 0;
            font-size: 1.9rem;
            line-height: 1.05;
        }

        .ui-shell p {
            margin: 12px 0 0;
            font-size: 0.96rem;
            line-height: 1.5;
            color: var(--text-muted);
        }

        .panel-group {
            margin-top: 22px;
            padding: 16px;
            border-radius: 18px;
            background: var(--surface);
        }

        .panel-group h2 {
            margin: 0 0 14px;
            font-size: 0.82rem;
            font-weight: 800;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .control {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .control + .control {
            margin-top: 14px;
        }

        .control label {
            font-weight: 700;
        }

        .control input[type="color"] {
            width: 54px;
            height: 36px;
            padding: 4px;
            border: none;
            border-radius: 999px;
            background: #fff;
            cursor: pointer;
        }

        .control input[type="range"] {
            flex: 1;
            accent-color: var(--accent);
        }

        .control select {
            min-width: 140px;
            padding: 9px 12px;
            border: 1px solid rgba(70, 56, 44, 0.16);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.9);
            color: var(--text-main);
            font: inherit;
        }

        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .hint {
            margin-top: 18px;
            padding-top: 16px;
            border-top: 1px solid rgba(70, 56, 44, 0.1);
            font-size: 0.88rem;
            color: var(--text-muted);
        }

        @media (max-width: 720px) {
            .app-shell {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr;
            }

            .ui-zone {
                padding: 12px;
            }

            .ui-shell {
                padding: 18px;
            }
        }
    </style>

    <!-- External dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
    <div class="app-shell">
        <div class="ui-zone">
            <aside class="ui-shell">
                <p class="eyebrow">Product Viewer</p>
                <h1>Shoe Customiser</h1>
                <p>Adjust the colours, change the rotation speed, and drag the model to inspect it from any angle.</p>

                <section class="panel-group">
                    <h2>Colour Finish</h2>
                    <div class="control">
                        <label for="shoeColorInput">Upper</label>
                        <input id="shoeColorInput" type="color" value="#d84a3a">
                    </div>
                    <div class="control">
                        <label for="laceColorInput">Laces</label>
                        <input id="laceColorInput" type="color" value="#202020">
                    </div>
                    <div class="control">
                        <label for="soleColorInput">Sole</label>
                        <input id="soleColorInput" type="color" value="#f2f2ec">
                    </div>
                </section>

                <section class="panel-group">
                    <h2>Motion</h2>
                    <div class="toggle-row">
                        <label for="autoRotateToggle">Auto Rotate</label>
                        <input id="autoRotateToggle" type="checkbox" checked>
                    </div>
                    <div class="control">
                        <label for="rotateSpeedInput">Speed</label>
                        <input id="rotateSpeedInput" type="range" min="0" max="0.02" step="0.0005" value="0.0035">
                    </div>
                </section>

                <section class="panel-group">
                    <h2>Material</h2>
                    <div class="control">
                        <label for="materialSelect">Finish</label>
                        <select id="materialSelect">
                            <option value="leather">Leather</option>
                            <option value="matte">Matte</option>
                            <option value="gloss">Gloss</option>
                            <option value="rubber">Rubber</option>
                        </select>
                    </div>
                </section>
            </aside>
        </div>
        <div class="viewport-zone">
            <div id="sceneViewport"></div>
        </div>
    </div>
    <script src="setup.js"></script>
    <script src="loadModel.js"></script>
    <script src="build.js"></script>
    <script src="animate.js"></script>
    <script src="run.js"></script>
</body>
</html>
